{% extends 'base.html' %}
{% block title %}Tags — {{ super() }}{% endblock %}
{% block content %}
<h1 class="glitch-title" data-txt="TAGS">TAGS</h1>
<div class="chips chips-index">
  {% for tag, arts in tags|sort %}
  <a class="chip" href="{{ SITEURL }}/{{ tag.url }}">{{ tag }} <span class="count">{{ arts|length }}</span></a>
  {% endfor %}
</div>
{% endblock %}
