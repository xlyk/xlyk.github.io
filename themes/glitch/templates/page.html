{% extends 'base.html' %}
{% block title %}{{ page.title|striptags }} — {{ super() }}{% endblock %}
{% block content %}
<article class="post">
  <h1 class="glitch-title" data-txt="{{ page.title|striptags }}">{{ page.title }}</h1>
  <div class="post-content">
    {{ page.content }}
  </div>
</article>
{% endblock %}
