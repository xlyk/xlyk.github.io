<!DOCTYPE html>
<html lang="{{ DEFAULT_LANG }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08080d">
  <title>{% block title %}{{ SITENAME|striptags }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ SITESUBTITLE|default('Notes on AI engineering, code, and tooling.') }}{% endblock %}">
  <link rel="icon" href="{{ SITEURL }}/theme/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="{{ SITEURL }}/theme/fonts/vt323.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ SITEURL }}/theme/fonts/share-tech-mono.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ SITEURL }}/theme/fonts/ibm-plex-sans-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ SITEURL }}/theme/css/glitch.css">
  <link rel="stylesheet" href="{{ SITEURL }}/theme/css/pygments-glitch.css">
  {% if FEED_ALL_ATOM %}<link rel="alternate" type="application/atom+xml" title="{{ SITENAME }} Atom" href="{{ SITEURL }}/{{ FEED_ALL_ATOM }}">{% endif %}
  <meta property="og:site_name" content="{{ SITENAME|striptags }}">
  <meta property="og:locale" content="en_US">
  {% block canonical %}{% endblock %}
  {% block opengraph %}
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ SITENAME|striptags }}">
  <meta property="og:description" content="{{ SITESUBTITLE|default('Notes on AI engineering, code, and tooling.') }}">
  <meta property="og:url" content="{{ SITEURL }}/">
  <meta name="twitter:card" content="summary">
  {% endblock %}
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="fx-scanlines" aria-hidden="true"></div>
  <div class="fx-noise" aria-hidden="true"></div>
  <a class="skip-link" href="#main">skip to content</a>
  {% include '_includes/nav.html' %}
  <main id="main" class="wrap">
    {% block content %}{% endblock %}
  </main>
  {% include '_includes/footer.html' %}
  <script src="{{ SITEURL }}/theme/js/glitch.js" defer></script>
</body>
</html>
